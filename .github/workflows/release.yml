name: Release

on:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Keeps one release PR open (version bump + CHANGELOG.md) and, when it merges, tags
      # vX.Y.Z and creates the GitHub release. RELEASE_PLZ_TOKEN keeps its historical name;
      # it is a fine-grained PAT for this repository (Contents and Pull requests read/write,
      # possibly Issues read/write for the release labels). A PAT is needed because tags
      # pushed with GITHUB_TOKEN do not trigger image.yml.
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
