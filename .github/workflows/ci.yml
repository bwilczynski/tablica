name: CI

# Called by pr-validation.yml on pull requests and by release.yml on pushes to main.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test
