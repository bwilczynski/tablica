name: Image

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "config.sample.toml"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "contrib/docker/**"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tablica-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eu
          mkdir -p data secrets
          cp config.sample.toml data/config.toml
          for name in $(grep -oE '"[a-z0-9_]+"' config.sample.toml \
              | grep -E '(_key|_url|_login|_password)"$' | tr -d '"' | sort -u); do
            echo dummy > "secrets/${name}"
          done
          chmod -R a+rX secrets
          sudo chown -R 1000:1000 data
          # Librus must never see the dummy credentials, so its hosts resolve to loopback.
          docker run -d --name tablica-smoke -p 127.0.0.1:8080:8080 \
            --add-host api.librus.pl:127.0.0.1 \
            --add-host portal.librus.pl:127.0.0.1 \
            --add-host synergia.librus.pl:127.0.0.1 \
            -v "$PWD/data:/data" -v "$PWD/secrets:/run/secrets:ro" tablica-smoke
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8080/preview/family.png
          curl -fsS -o /dev/null http://127.0.0.1:8080/preview/homelab.png
      - name: Container log
        if: failure()
        run: docker logs tablica-smoke

  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: contrib/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
