name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Tags vX.Y.Z and creates the GitHub release when a release PR merges. Uses a PAT
  # (RELEASE_PLZ_TOKEN): tags pushed with GITHUB_TOKEN do not trigger the image workflow.
  # RELEASE_PLZ_TOKEN is a repository Actions secret holding a fine-grained PAT for this
  # repository with Contents and Pull requests read/write; both jobs fail without it.
  release:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
