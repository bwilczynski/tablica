# release-plz keeps one release PR open with the next version (Cargo.toml bump +
# CHANGELOG.md) from conventional commits. Merging it tags vX.Y.Z and creates the
# GitHub release with the changelog section as notes. The tag triggers the image
# workflow (.github/workflows/image.yml), which publishes ghcr.io/bwilczynski/tablica.
#
# release-plz pushes the tag before it creates the GitHub release, and a rerun skips a
# version whose tag exists. If the release step fails after tagging, the image still
# publishes: create the missing release by hand from the existing tag, with that
# version's CHANGELOG.md section as notes (`gh release create vX.Y.Z --notes-file ...`).
[workspace]
# Versions come from git tags; the crate is not published to crates.io.
git_only = true
publish = false
git_release_enable = true
semver_check = false
git_tag_name = "v{{ version }}"
# Tag only when a release PR merges, never on an untagged version in main.
release_always = false
# Only user-facing changes open a release PR.
release_commits = "^(feat|fix)"

[[package]]
name = "tablica"
changelog_path = "./CHANGELOG.md"

[changelog]
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
    { message = ".*", group = "other" },
]
