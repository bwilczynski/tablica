[package]
name = "tablica"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "TRMNL e-ink backend serving family and homelab dashboards"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
icalendar = { version = "0.17.17", features = ["parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "cookies", "multipart", "form"] }
rrule = "0.14.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"
toml = "1.2.3"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
