[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
http-body-util = "0.1.5"
icalendar = { version = "0.17.17", features = ["parser"] }
image = "0.25.10"
minijinja = { version = "2.24.0", features = ["loader", "serde"] }
minijinja-autoreload = "2.24.0"
minijinja-embed = "2.24.0"
png = "0.18.1"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "cookies", "multipart", "form"] }
rrule = "0.14.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
takumi = { version = "=2.22.1", features = ["from-html"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.20"
toml = "1.2.3"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"
